name: .NET foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.packages

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked dependencies
        run: dotnet restore ServiceDeckManagement.sln --locked-mode
      - name: Build
        run: dotnet build ServiceDeckManagement.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ServiceDeckManagement.sln --configuration Release --no-build --logger trx
      - name: Verify public repository content
        shell: pwsh
        run: ./scripts/verify-public-repository.ps1
      - name: Verify gitignore boundaries
        shell: pwsh
        run: ./scripts/verify-gitignore.ps1
