name: Repository safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-safety:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify public repository content
        shell: pwsh
        run: ./scripts/verify-public-repository.ps1
